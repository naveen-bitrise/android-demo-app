# Project identification
sonar.projectKey=android-demo-app
sonar.projectName=Android Demo App
sonar.projectVersion=1.0

# Source directories
sonar.sources=src/main/java,src/main/kotlin
sonar.java.sources=src/main/java,src/main/kotlin

# Test directories
sonar.tests=src/test,src/androidTest

# JaCoCo XML report path
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Exclude generated files, tests, etc.
sonar.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/*Test*.*,**/androidTest/**,**/test/**,android/**/*.*

# Java bytecode directories
sonar.java.binaries=build/intermediates/javac/debug

# Run in local mode
sonar.scanner.mode=local